name: Publish Salvatore Sinatra Web
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate portfolio architecture
        shell: bash
        run: |
          set -euo pipefail
          for file in docs/index.html docs/identity/index.html docs/professional/index.html docs/assets/portfolio-system.css docs/sitemap.xml docs/robots.txt docs/.nojekyll; do
            test -f "$file" || { echo "::error::Missing $file"; exit 1; }
          done
          python3 -m json.tool docs/assets/identity-config.json >/dev/null
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('docs/sitemap.xml')
          print('Identity and professional portfolio checks passed')
          PY
  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
